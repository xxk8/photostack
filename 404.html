<!DOCTYPE html>
<!-- This is a redirect to the home page -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转…</title>
    <script>
        // GitHub Pages 项目站点部署在 /仓库名/ 子路径下，404 页可能出现在任意深度的地址上。
        // 从当前地址推导站点根目录：/用户名.github.io/仓库名/任意路径 → 跳回 /用户名.github.io/仓库名/
        (function () {
            var seg = location.pathname.split('/')[1];
            location.replace(seg ? '/' + seg + '/' : '/');
        })();
    </script>
</head>

<body>

    <p>
        正在跳转，如果没有自动跳转，请<a href="/">点击这里</a>。
    </p>

</body>

</html>
