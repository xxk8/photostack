<!DOCTYPE html>
<html lang="zh-CN" data-photostack-mode="watermark-editor">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>水印管理</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="批量给图片加描边和圆角，支持缩放、水印、裁剪。所有处理均在本地浏览器中完成，可离线使用。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../css/bootstrap.min.css?v=20261010" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap-icons.css?v=20261010">
    <link rel="stylesheet" href="../css/photostack-styles.css?v=20261010">
    <script src="../js/shared.js?v=20261010"></script>
    <!-- Icons and theme -->
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="24x24" href="../img/icon_x24.png">
    <link rel="manifest" href="../site.webmanifest">
    <link rel="shortcut icon" href="../favicon.ico">
    <meta name="theme-color" content="#6c757d">
    <!-- Open Graph card -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="批量描边工具" />
    <meta property="og:description" content="批量给图片加描边和圆角，支持缩放、水印、裁剪。" />
    <meta property="og:image" content="../img/maskable_icon_x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="og:image:alt" content="应用图标" />
    <meta name="twitter:card" content="summary" />
</head>

<body style="padding-top: 56px;">

    <!-- Nav bar -->
    <nav class="navbar fixed-top bg-body-secondary navbar-expand-sm border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand d-sm-none" href="#">批量描边工具</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../">
                            <i class="bi bi-house-fill"></i>
                            首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../edit/">
                            <i class="bi bi-images"></i>
                            编辑器
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../outline/">
                            <i class="bi bi-vector-pen"></i>
                            自动描边
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">
                            <i class="bi bi-pencil"></i>
                            水印
                        </a>
                    </li>
                </ul>
                <form class="d-flex flex-column flex-sm-row">
                    <!-- Theme toggle -->
                    <button class="btn btn-primary dropdown-toggle mt-2 mt-sm-0" role="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="切换外观">
                        <i class="bi bi-moon-stars-fill me-2 me-sm-0 me-md-2"></i>
                        <span class="d-sm-none">外观</span>
                    </button>
                    <div class="dropdown">
                        <ul class="dropdown-menu dropdown-menu-end w-100 w-sm-auto">
                            <li><a class="dropdown-item photostack-theme-btn" data-theme="light" href="#">
                                    <i class="bi bi-brightness-high-fill me-2"></i>
                                    浅色模式
                                </a></li>
                            <li><a class="dropdown-item photostack-theme-btn" data-theme="dark" href="#">
                                    <i class="bi bi-moon-fill me-2"></i>
                                    深色模式
                                </a></li>
                            <li><a class="dropdown-item photostack-theme-btn" data-theme="auto" href="#">
                                    <i class="bi bi-circle-half me-2"></i>
                                    跟随系统
                                </a></li>
                        </ul>
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main container -->

    <div class="container mt-5 mb-5">

        <div class="row mb-4">
            <div class="col-6">
                <button type="button" id="photostack-watermark-new-btn" class="btn btn-primary w-100">
                    <i class="bi bi-file-earmark-plus"></i>
                    新建水印
                </button>
            </div>
            <div class="col-6">
                <button type="button" id="photostack-watermark-import-btn" class="btn btn-primary w-100">
                    <i class="bi bi-folder-plus"></i>
                    导入水印
                </button>
            </div>
        </div>
        <div class="list-group mb-4" id="photostack-watermark-manager-list" role="tablist">
            <!-- This is populated by watermarks.js -->
        </div>
        <h3>如何使用水印</h3>
        <p>可以在这里创建自定义水印，然后在编辑器的「水印」设置中把水印添加到图片上。水印数据保存在浏览器的本地存储中，不会被上传或分享。</p>
        <p>点击「导出」可以把水印保存为文件，用于备份或分享。在其他设备上打开本页面，点击「导入水印」即可把文件中的水印添加到列表里。</p>
    </div>

    <!-- Watermark editor modal -->
    <div class="modal fade" id="photostack-watermark-editor-modal" tabindex="-1" role="dialog" aria-labelledby="#photostack-watermark-editor-modal-title" aria-hidden="true">
        <input type="file" id="photostack-watermark-import-image" accept="image/jpeg,image/png,image/gif">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="photostack-watermark-editor-modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body" style="padding-left: 0; padding-right: 0">
                    <div class="container-fluid">
                        <div class="row">
                            <!-- Preview row -->
                            <div class="col-12 col-sm-6">
                                <img src="" id="photostack-watermark-editor-preview">
                            </div>
                            <!-- Watermark settings row -->
                            <div class="col-12 col-sm-6">
                                <!-- Image import -->
                                <div class="mb-3">
                                    <button class="btn btn-primary w-100" type="button" id="photostack-watermark-editor-image-btn">选择图片</button>
                                </div>
                                <!-- Anchor position -->
                                <div class="form-label mb-3">锚点位置</div>
                                <div class="row mb-3">
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-1">1</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-2">2</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-3">3</button>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-4">4</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-primary photostack-anchor-btn" id="photostack-watermark-pos-5">5</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-6">6</button>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-7">7</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-8">8</button>
                                    </div>
                                    <div class="col-4">
                                        <button type="button" class="btn w-100 btn-secondary photostack-anchor-btn" id="photostack-watermark-pos-9">9</button>
                                    </div>
                                </div>
                                <!-- Effects -->
                                <div class="form-label mb-3">效果</div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text">大小 (%)</span>
                                    <input type="number" class="form-control" min="0" max="100" aria-label="大小" id="photostack-watermark-size" value="30" autocomplete="off" enterkeyhint="done">
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text">不透明度 (%)</span>
                                    <input type="number" class="form-control" min="0" max="100" aria-label="不透明度" id="photostack-watermark-opacity" value="50" autocomplete="off" enterkeyhint="done">
                                </div>
                                <div class="mb-3">
                                    <label for="photostack-watermark-horizontal-inset" class="form-label">水平边距</label>
                                    <input type="range" class="form-range" autocomplete="off" id="photostack-watermark-horizontal-inset" min="-10" max="10" value="0" enterkeyhint="done">
                                    <label for="photostack-watermark-vertical-inset" class="form-label">垂直边距</label>
                                    <input type="range" class="form-range" autocomplete="off" id="photostack-watermark-vertical-inset" min="-10" max="10" value="0" enterkeyhint="done">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">放弃更改</button>
                    <button type="button" class="btn btn-primary" id="photostack-watermark-editor-save-btn">保存</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Watermark image cache -->
    <img id="photostack-watermark-cache">
    <!-- File picker -->
    <input type="file" id="photostack-watermark-file-import" multiple accept=".json">
    <!-- Scripts -->
    <script src="../js/FileSaver.min.js?v=20261010"></script>
    <script src="../js/localforage.min.js?v=20261010"></script>
    <script src="../js/pica.min.js?v=20261010"></script>
    <script src="../js/bootstrap.bundle.min.js?v=20261010"></script>
    <script src="../js/watermarks.js?v=20261010"></script>

</body>

</html>
